apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-app
  namespace: resume
  labels:
    app: resume-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resume-app
  template:
    metadata:
      labels:
        app: resume-app
    spec:
      containers:
        - name: resume-app
          image: _placeholder   # Kustomize will replace with frontend image
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            # ============================================
            # Database credentials from Secret
            # ============================================
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password

            # ============================================
            # Database connection string
            # ============================================
            - name: DATABASE_URL
              value: "postgresql://resume_admin:$(POSTGRES_PASSWORD)@<RDS_ENDPOINT>:5432/resume_db"

            # Individual env vars (your backend may use these)
            - name: DB_HOST
              value: "ai-resume-analyzer-dev-postgres.ct2q6sim48e6.ap-south-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "resume_db"
            - name: DB_USER
              value: "resume_admin"

            # ============================================
            # Security
            # ============================================
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: secret-key   # We'll create this secret in the pipeline

            # ============================================
            # OpenAI (optional)
            # ============================================
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secret-store
                  key: OPENAI_KEY

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # ============================================
          # HEALTH PROBES (Self-healing)
          # ============================================
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5