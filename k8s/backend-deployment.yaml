apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-backend
  namespace: resume
  labels:
    app: resume-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-backend
  template:
    metadata:
      labels:
        app: resume-backend
    spec:
      containers:
        - name: backend
          image: _placeholder-backend   # will be replaced by Kustomize
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://resume_admin:$(POSTGRES_PASSWORD)@<RDS_ENDPOINT>:5432/resume_db"   # will be patched
            - name: DB_HOST
              value: "<RDS_ENDPOINT>"
            - name: DB_USER
              value: "resume_admin"
            - name: DB_NAME
              value: "resume_db"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: secret-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secret-store
                  key: OPENAI_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5