version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: resume-postgres

    restart: always

    environment:
      POSTGRES_DB: resume_db
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_password

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend

    depends_on:
      - postgres

    ports:
      - "8000:8000"

  frontend:
    build: ./frontend

    depends_on:
      - backend

    ports:
      - "5173:5173"

volumes:
  postgres-data:
